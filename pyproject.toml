[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claisum"
version = "1.0.0.1"
description = "Customize Discord with themes and plugins — no BetterDiscord required."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Claisum", email = "contact@claisum.dev" }]
requires-python = ">=3.12"
keywords = ["discord", "theme", "plugin", "mod", "customize", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "colorama>=0.4",
    "rich>=13.0",
]

[project.urls]
Homepage   = "https://github.com/claisum/Claisum.py"
Repository = "https://github.com/claisum/Claisum.py"
"Bug Tracker" = "https://github.com/claisum/Claisum.py/issues"

[project.scripts]
claisum = "claisum.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claisum*"]
