name: Build & Release Installers

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to'
        required: true
        default: '1.0.0.1'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pyinstaller-hooks-contrib click rich
      - name: Build Claisum_Setup.exe
        run: |
          pyinstaller --onefile --windowed --name "Claisum_Setup" `
            --add-data "claisum/discord/claisum_inject.js;." `
            installer-src/installer.py
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/Claisum_Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pyinstaller-hooks-contrib click rich
      - name: Build Claisum_Linux_Setup
        run: |
          pyinstaller --onefile --name "Claisum_Linux_Setup" \
            --add-data "claisum/discord/claisum_inject.js:." \
            installer-src/installer_linux.py
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/Claisum_Linux_Setup
