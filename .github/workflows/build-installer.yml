name: Build Installer (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE only (no release)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install click requests colorama "rich>=13.0"

      - name: Build claisum.exe
        run: |
          pyinstaller --onefile --console --name claisum claisum/cli.py

      - name: Build Claisum-Setup.exe
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "Claisum-Setup" `
            --add-data "dist/claisum.exe;." `
            installer-src/installer.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Claisum-Windows-EXE
          path: |
            dist/Claisum-Setup.exe
            dist/claisum.exe
          retention-days: 7
