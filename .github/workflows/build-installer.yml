name: Build Installer EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer (no dependencies required)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and dependencies
        run: |
          pip install pyinstaller
          pip install click requests colorama "rich>=13.0"

      - name: Build claisum.exe (standalone CLI)
        run: |
          pyinstaller `
            --onefile `
            --console `
            --name claisum `
            claisum/cli.py
        # Result: dist/claisum.exe — fully self-contained, no Python needed

      - name: Build Claisum-Setup.exe (GUI installer with bundled CLI)
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "Claisum-Setup" `
            --add-data "dist/claisum.exe;." `
            installer-src/installer.py
        # claisum.exe is embedded inside Claisum-Setup.exe
        # User only needs to download Claisum-Setup.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claisum-Setup-Windows
          path: |
            dist/Claisum-Setup.exe
            dist/claisum.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Claisum ${{ github.ref_name }}"
          body: |
            ## Claisum ${{ github.ref_name }}

            ### Windows — GUI Installer (recommended)
            1. Download **`Claisum-Setup.exe`**
            2. Double-click it
            3. Follow the steps — done!

            **No Python, no Git, no Node.js required.**
            Discord will be restarted automatically.

            ---

            ### Windows — CLI only (portable)
            Download **`claisum.exe`** and place it anywhere on your PATH.

            ### Linux / Android
            ```bash
            pip install https://github.com/claisum/Claisum.py/archive/refs/heads/main.zip
            ```

          files: |
            dist/Claisum-Setup.exe
            dist/claisum.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
